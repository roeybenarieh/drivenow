fastAPI:
  address: "0.0.0.0"
  port: 8000
rabbitmq:
  dsn: amqp://drivenow:drivenow@rabbitmq:5672/
  queue_name: "drivenow"
  prefetch_count: 20
postgres:
  dsn: "postgresql://drivenow:drivenow@postgres:5432/drivenow"
observability:
  metrics:
    service_name: drivenow-backend
    meter_name: "drive_now"
    address: "0.0.0.0"
    port: 8001
  logging:
    logger_name: "drivenow"
    # for more information look in: https://docs.python.org/3/library/logging.config.html#logging-config-dictschema
    config:
      version: 1
      disable_existing_loggers: false
      formatters:
        standard:
          format: "%(asctime)s (%(levelname)s) [%(name)s] : %(message)s"
      handlers:
        console:
          class: logging.StreamHandler
          formatter: standard
          stream: ext://sys.stdout
        file:
          class: logging.handlers.RotatingFileHandler
          formatter: standard
          filename: file.log # the directory of the file must exist beforehand
          maxBytes: 10485760  # 10 MB
          backupCount: 0
      loggers:
        drivenow:
          level: INFO
          handlers: [ console, file ]
        aio_pika:
          level: DEBUG
          handlers: [ console, file ]
          propagate: false
