services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      CONFIGURATION_FILE_PATH: config/config-compose.yaml
    develop:
      watch:
        - action: rebuild
          path: ./src
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@drivenow.com
      PGADMIN_DEFAULT_PASSWORD: drivenow
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drivenow
      POSTGRES_PASSWORD: drivenow
      POSTGRES_DB: drivenow
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U drivenow" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: drivenow
      RABBITMQ_DEFAULT_PASS: drivenow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  pgadmin_data:
  rabbitmq_data:
